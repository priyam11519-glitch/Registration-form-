<html>
<head>
    <title>Tarang Registration</title>
</head>
<body>
<h2><center>STUDENT REGISTRATION FORM</center></h2>
<center><h3>Tarang 2026 - Inter College Function</h3></center>
<hr>
<form>
<h2>Student Details</h2>
<label>Name:</label>
<input type="text" name="student_name" required>
<br><br>
<label>Register Number:</label>
<input type="text" name="register_number" required>
<br><br>
<label>Department:</label>
<input type="text" name="department" required>
<br><br>
<label>Year:</label>
<select name="year" required>
    <option value="">Select Year</option>
    <option>Year-I</option>
    <option>Year-II</option>
    <option>Year-III</option>
</select>
<br><br>
<label>College Name:</label>
<input type="text" name="college_name" required>
<br><br>
<hr>
<h2>Personal Details</h2>
<label>Email ID:</label>
<input type="email" name="email" required>
<br><br>
<label>Phone Number:</label>
<input type="tel" name="phone_number" required>
<br><br>
<label>Date of Birth:</label>
<input type="date" name="date_of_birth" required>
<br><br>
<label>Gender:</label>
<br>
<input type="radio" name="gender" value="Male" required>
<label>Male</label>
<br>
<input type="radio" name="gender" value="Female">
<label>Female</label>
<br>
<input type="radio" name="gender" value="Others">
<label>Others</label>
<br><br>
<label>Address:</label>
<br>
<textarea name="address" rows="4" cols="40" required></textarea>
<br><br>
<hr>
<h2>Event Details</h2>
<label>Select the Event:</label>
<br>
<select name="event" required>
<option value="">Select Event</option>
<option>Solo Singing</option>
<option>Face Paint</option>
<option>Solo Dance</option>
<option>Group Dance</option>
<option>Quiz</option>
<option>Photography</option>
<option>Short Film</option>
<option>Fashion Show</option>
</select>
<br><br>
<label>Participation Type:</label>
<br>
<input type="radio" name="participation_type" value="Individual" required>
<label>Individual</label>
<br>
<input type="radio" name="participation_type" value="Team">
<label>Team</label>
<br><br>
<label>Team Name:</label>
<input type="text" name="team_name">
<br><br>
<label>Number of Team Members:</label>
<input type="number" name="team_members">
<br><br>
<hr>
<h2>Payment Details</h2>
<label>Payment Mode:</label>
<br>
<input type="radio" name="payment_mode" value="Online" required>
<label>Online</label>
<br>
<input type="radio" name="payment_mode" value="Offline">
<label>Offline</label>
<br><br>
<label>Transaction ID:</label>
<input type="text" name="transaction_id">
<br><br>
<label>Upload Payment Screenshot:</label>
<input type="file" name="payment_screenshot">
<br><br>
<hr>
<h2>Additional Information</h2>
<label>Upload College ID:</label>
<input type="file" name="college_id">
<br><br>
<label>Upload Passport Size Photo:</label>
<input type="file" name="passport_photo">
<br><br>
<label>Any Special Requirements:</label>
<br>
<textarea name="special_requirements" rows="4" cols="40"></textarea>
<br><br>
<input type="checkbox" name="agreement" required>
<label>I agree to follow the rules and regulations of Tarang.</label>
<br><br>
<input type="submit" value="Register">
<input type="reset" value="Clear">
</form>
</body>
</html>
